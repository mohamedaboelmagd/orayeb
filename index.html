<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>قريّب – أقرب مكان فيه خصمك</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true">ق</div>
        <div>
          <h1>قريّب</h1>
          <p class="tagline">أقرب مكان فيه خصمك · التجمع الخامس</p>
        </div>
      </div>
      <button type="button" id="btnView" class="icon-btn" title="تبديل العرض">🗺️</button>
    </header>

    <section class="subs card-strip" aria-label="اشتراكاتي">
      <div class="strip-label">اشتراكاتي</div>
      <div class="chips" id="subsChips">
        <button type="button" class="chip sub on" data-sub="waffarha" aria-pressed="true">وفرها <span class="hint">افتراضي</span></button>
        <button type="button" class="chip sub" data-sub="xclusives" aria-pressed="false">Xclusives</button>
        <button type="button" class="chip sub" data-sub="waffarx" aria-pressed="false">WaffarX</button>
      </div>
    </section>

    <section class="filters" aria-label="فلاتر الخصم">
      <div class="chips scroll" id="dealFilters">
        <button type="button" class="chip filter on" data-filter="all">الكل</button>
        <button type="button" class="chip filter" data-filter="mine">خصوماتي بس</button>
        <button type="button" class="chip filter" data-filter="waffarha">وفرها</button>
        <button type="button" class="chip filter" data-filter="xclusives">Xclusives</button>
        <button type="button" class="chip filter" data-filter="waffarx">WaffarX</button>
      </div>
      <div class="chips scroll" id="catFilters">
        <button type="button" class="chip cat on" data-cat="الكل">الكل</button>
        <button type="button" class="chip cat" data-cat="صيدليات">صيدليات</button>
        <button type="button" class="chip cat" data-cat="مطاعم">مطاعم</button>
        <button type="button" class="chip cat" data-cat="كافيهات">كافيهات</button>
        <button type="button" class="chip cat" data-cat="حلويات">حلويات</button>
        <button type="button" class="chip cat" data-cat="معامل">معامل</button>
        <button type="button" class="chip cat" data-cat="فسح">فسح</button>
      </div>
    </section>

    <div class="stats" id="stats">جاري التحميل…</div>

    <main id="main" class="list-mode">
      <div id="list" class="list" role="list"></div>
      <div id="mapWrap" class="map-wrap hidden">
        <div id="map"></div>
        <p class="map-note">المواقع تقريبية للديمو · النقطة الزرقاء = موقع افتراضي وسط التجمع</p>
      </div>
    </main>

    <footer class="disclaimer">
      ديمو تجريبي · بيانات أولية من شيت التجميع · مش تابع لوفرها أو Xclusives أو WaffarX
    </footer>
  </div>

  <div id="sheet" class="sheet" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="sheet-backdrop" id="sheetBackdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-handle"></div>
      <div id="sheetBody"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
